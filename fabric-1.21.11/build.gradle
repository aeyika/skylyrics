plugins { id 'net.fabricmc.fabric-loom-remap' version '1.17.13' }
group = 'dev.skylyrics'
version = '0.1.0+mc1.21.11'
base { archivesName = 'skylyrics' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.20.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
    implementation project(':core')
    include project(':core')
    include 'org.java-websocket:Java-WebSocket:1.6.0'
}
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
sourceSets.main.java.srcDir '../presentation/src/main/java'
sourceSets.main.resources.srcDir '../presentation/src/main/resources'
loom.accessWidenerPath = file('src/main/resources/skylyrics.accesswidener')
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8' }
processResources { inputs.property 'version', version; filesMatching('fabric.mod.json') { expand version: version } }
check.dependsOn ':presentation:test'
fabricApi { configureTests { createSourceSet = true; modId = 'skylyrics-tests'; enableGameTests = false; enableClientGameTests = true; clearRunDirectory = false; eula = true } }
sourceSets.gametest.java.srcDir '../test-fixtures/client-tests'
sourceSets.gametest.resources.srcDir '../test-fixtures/client-test-resources'
loom.runs.clientGameTest { runDir '../test-runs/gametest-1.21.11'; vmArg "-Dskylyrics.configDir=${file('../test-runs/gametest-shared-config')}"; vmArg "-Dskylyrics.testOutput=${file('../test-results/ingame-1.21.11')}" }
def testSuffix = providers.gradleProperty('skylyricsTestSuffix').getOrElse('')
def compat = providers.gradleProperty('skylyricsCompat').getOrElse('none')
loom.runs.clientGameTest {
    runDir "../test-runs/gametest-1.21.11${testSuffix}"
    vmArg "-Dskylyrics.testOutput=${file('../test-results/ingame-1.21.11' + testSuffix)}"
    vmArg "-Dskylyrics.captureFrames=${providers.gradleProperty('skylyricsCaptureFrames').getOrElse('0')}"
    vmArg "-Dskylyrics.testMultiplayer=${providers.gradleProperty('skylyricsMultiplayer').getOrElse('false')}"
    vmArg "-Dskylyrics.testPhoton=${providers.gradleProperty('skylyricsPhoton').getOrElse('false')}"
}
if (compat != 'none') { dependencies { modRuntimeOnly fileTree(dir: '../tools/compat-mods/1.21.11', include: compat == 'iris' ? '*.jar' : 'sodium-*.jar') } }
if (compat == 'iris') {
    // Loom's development classpath does not expose Iris' nested plain Java
    // libraries. Use the exact copies from the pinned Iris test jar; these
    // runtime-only dependencies are never nested into the release mod.
    def irisTestJar = fileTree(dir: '../tools/compat-mods/1.21.11', include: 'iris-*.jar').singleFile
    dependencies {
        runtimeOnly files(zipTree(irisTestJar).matching {
            include 'META-INF/jars/antlr4-runtime-4.13.1.jar'
            include 'META-INF/jars/glsl-transformer-3.0.0-pre3.jar'
            include 'META-INF/jars/jcpp-1.4.14.jar'
        })
    }
}
loom { runs { client { runDir '../test-runs/1.21.11'; vmArg '-Dskylyrics.demo=true'; vmArg "-Dskylyrics.configDir=${file('../test-runs/shared-config')}" } } }
